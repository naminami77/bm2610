<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>10월 지점장 시책 시뮬레이터</title>
<style>
:root{--red:#9b1c1c;--red2:#c62828;--pink:#fdeaea;--ink:#1c1c1e;--sub:#6b6b70;--line:#e6e2e2;--bg:#f6f4f3;--card:#fff;--ok:#1b7f4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.45}
header{background:var(--red);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:19px}
header p{margin:3px 0 0;font-size:12.5px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:12px 12px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.card h2{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--pink);color:var(--red)}
.tag.auto{background:#e6f4ec;color:var(--ok)}
.desc{font-size:12.5px;color:var(--sub);margin:0 0 10px}
.pick{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
select,input[type=number],input[type=text]{width:100%;font:inherit;padding:9px 10px;border:1px solid #cfc9c9;border-radius:8px;background:#fff;color:var(--ink)}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
input:focus,select:focus{outline:2px solid var(--red2);outline-offset:1px}
label.f{display:block;font-size:12.5px;color:var(--sub)}
label.f span{display:block;margin-bottom:3px}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.res{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.res b{font-size:17px;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:12.5px;color:var(--ok);margin-top:6px}
.warn{font-size:12.5px;color:var(--red2);margin-top:6px}
.sum{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.sum .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.sum .row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;opacity:.92;margin-top:2px}
.sum small{opacity:.85;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--red);color:#fff;font-weight:600;padding:6px 4px;font-size:12.5px}
td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
td input[type=number]{padding:6px;width:100px}
td input[type=text]{padding:6px;width:92px}
tr.edit td{background:#fff9e6}
.tw{overflow-x:auto}
h3{margin:14px 0 6px;font-size:14px}
h3 small{font-weight:400;color:var(--sub)}
button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--red);background:#fff;color:var(--red);cursor:pointer}
button.p{background:var(--red);color:#fff}
button.s{padding:4px 8px;font-size:12.5px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px}
.chk input{margin-top:3px;width:17px;height:17px;accent-color:var(--red)}
.brk td{padding:6px 2px}.brk tr.t td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0}
details summary{cursor:pointer;font-weight:700}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
#st{font-size:12.5px;color:var(--sub);margin-top:8px;white-space:pre-line}
@media(max-width:520px){.g4{grid-template-columns:1fr 1fr}.pick{grid-template-columns:1fr}.sum .big{font-size:22px}}
</style>
</head>

function perf(t,rate,v){return v>600?v*rate:step(t,v)}           // 만원
function head(t,per,n){var m=t[t.length-1][0];return n>m?n*per:step(t,n)}
function W(m){return Math.round(m*10000).toLocaleString('ko-KR')+'원'}
function M(m){return (Math.round(m*100)/100).toLocaleString('ko-KR')+'만'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sv(x){x=+x||0;return x<1000?x:x/1e4}
function mw(x){x=+x||0;return x>=10000?x/1e4:x}
function $(i){return document.getElementById(i)}

/* ---------- 상태 ---------- */
var cen,br,S;
function blank(){return{rk:[0,0,0,0],ac:0,ch:0,pa:0,cut:[0,0,0],dbn:0,dbs:0,cx:0,cxcut:0,st:0,ov:{pa:{},cx:{}},add:{pa:[],cx:[]}}}
function load(){var b=blank(),s=lget('in:'+br)||{};for(var k in b)if(s[k]!=null)b[k]=s[k];S=b}
function save(){lset('in:'+br,S)}
function branches(){var m={};['pa','cx'].forEach(function(k){DATA[k].rows.forEach(function(r){(m[r.c]=m[r.c]||{})[r.b]=1})});return m}

function initPick(){
  var m=branches(),cs=Object.keys(m).sort();
  var pc=lget('cen'),pb=lget('br');
  cen=cs.indexOf(pc)>=0?pc:(cs.filter(function(c){return c.indexOf('강남')>=0})[0]||cs[0]);
  $('cen').innerHTML=cs.map(function(c){return'<option'+(c==cen?' selected':'')+'>'+esc(c)+'</option>'}).join('');
  fillBr(pb);
  $('asof').textContent=DATA.asof+' 기준 · raw 자동 반영 + 수기 입력 시뮬레이션';
}
function fillBr(pref){
  var bs=Object.keys(branches()[cen]||{}).sort();bs.push('직접 입력(명단에 없음)');
  br=bs.indexOf(pref)>=0?pref:bs[0];
  $('br').innerHTML=bs.map(function(b){return'<option'+(b==br?' selected':'')+'>'+esc(b)+'</option>'}).join('');
  lset('cen',cen);lset('br',br);load();render();
}
$('cen').onchange=function(){cen=this.value;fillBr()};
$('br').onchange=function(){br=this.value;lset('br',br);load();render()};

/* ---------- 화면 ---------- */
function num(id,label,val,stepv){return'<label class="f"><span>'+label+'</span><input type="number" inputmode="decimal" min="0" step="'+(stepv||1)+'" data-k="'+id+'" value="'+(val||'')+'" placeholder="0"></label>'}
function spotRows(k){
  var rows=DATA[k].rows.filter(function(r){return r.b==br}).map(function(r){return{id:r.id,n:r.n,s:r.s/1e4,a:r.a/1e4,rk:r.r}});
  S.add[k].forEach(function(a,i){rows.push({id:'+'+i,n:a.n,s:0,a:0,man:1,i:i})});
  rows.forEach(function(r){var o=r.man?S.add[k][r.i].v:S.ov[k][r.id];r.ed=r.man||(o!=null&&o!=='');r.v=r.ed?sv(o):r.s;r.aw=r.ed?step(SPOT,r.v):r.a});
  return rows.sort(function(x,y){return(x.man?1:0)-(y.man?1:0)||y.v-x.v});
}
function spotHtml(k,title,who){
  var rows=spotRows(k),t=DATA[k].tot,left=Math.max(0,1000-t.a/1e4);
  var h='<h3>'+title+' <small>· '+who+'별 평가 · 전사 한도 잔여 '+M(left)+' / 1,000만</small></h3><div class="tw"><table><tr><th>'+who+'</th><th>raw 실적</th><th>예상 실적(원)</th><th>시책금</th><th>다음 구간</th></tr>';
  if(!rows.length)h+='<tr><td colspan="5" style="text-align:center;color:var(--sub)">raw 실적 없음 — 아래에서 추가해 입력하세요</td></tr>';
  rows.forEach(function(r){
    h+='<tr data-row="'+k+'|'+r.id+'"'+(r.ed?' class="edit"':'')+'><td>'+(r.man?'<input type="text" data-sn="'+k+'|'+r.i+'" value="'+esc(r.n)+'" placeholder="이름">':esc(r.n)+(r.rk?' <span class="tag auto">'+r.rk+'번</span>':''))+'</td><td>'+(r.man?'-':M(r.s))+'</td><td><input type="number" inputmode="decimal" min="0" step="10000" data-sv="'+k+'|'+r.id+'" value="'+(r.ed?Math.round(r.v*1e4):'')+'" placeholder="'+(r.man?0:Math.round(r.s*1e4))+'"></td><td class="aw"></td><td class="nx"></td></tr>'});
  h+='</table></div><div class="btns"><button class="s" data-add="'+k+'">+ '+who+' 추가</button></div><div class="res"><span>'+title+' 시책금</span><b id="o_sp'+k+'"></b></div>';
  return h;
}
function render(){
  var h='';
  h+='<div class="card sum"><small>'+esc(br)+' · 10월 예상 시책금</small><div class="big" id="o_tot"></div><div class="row"><span id="o_now"></span><span id="o_2y"></span><span id="o_ctr"></span></div></div>';
  h+='<div class="card"><h2>1주차 스팟 · 1천만원 도전 <span class="tag auto">raw 자동</span><span class="tag">수기 수정</span></h2><p class="desc">10.1(목)~10.5(월) 입력일 · 실적 5만/10만/15만 → 3만/10만/20만 · 선착순 한도 소진 시 종료 · 센터 판촉비 지급</p>'+spotHtml('pa','파트너스 실적','파트너스')+spotHtml('cx','교차 실적','FP')+'</div>';
  h+='<div class="card"><h2>파트너스 3종 시책 <span class="tag">수기 입력</span></h2><p class="desc">Rookie는 실적 시점별 인당 지급, Active·Chance는 인원 구간. 최고 구간 초과 시 인당 금액 × 인원</p><h3>Rookie <small>· 응시 후 영업일 구간별 인원</small></h3><div class="grid g4">'+ROOKIE.map(function(r,i){return num('rk'+i,r[0]+' ('+r[1]+'만)',S.rk[i])}).join('')+'</div><div class="grid g2" style="margin-top:8px">'+num('ac','Active 인원',S.ac)+num('ch','Chance 인원',S.ch)+'</div><div id="o_3h"></div><div class="res"><span>3종 합계</span><b id="o_3"></b></div></div>';
  h+='<div class="card"><h2>파트너스 성과 인센티브 Ⅰ·Ⅱ <span class="tag">수기 입력</span></h2><p class="desc">10.1~10.31 파트너스 전체 실적(증권당 최대 20만, 실손 제외). 만원 단위 입력(원 단위로 넣어도 자동 환산). Ⅰ 초회 지급 + Ⅱ 2차년도 지급</p>'+num('pa','10월 파트너스 매출 (만원)',S.pa,10)+'<div id="o_pah"></div><div class="res"><span>Ⅰ 초회 + Ⅱ 2차년도</span><b id="o_pa"></b></div></div>';
  h+='<div class="card"><h2>컷오프 <span class="tag">수기 체크</span></h2><p class="desc">미달 항목마다 3종 + 성과 인센티브에 90% 적용</p>'+['KMV율 2,500% 미만','2~4회차 수금율 93% 미만','당월 위촉율 85% 미만 (6개월 합산 85% 이상이면 제외)'].map(function(t,i){return'<label class="chk"><input type="checkbox" data-c="'+i+'"'+(S.cut[i]?' checked':'')+'>'+t+'</label>'}).join('')+'<div id="o_cut" class="warn"></div></div>';
  h+='<div class="card"><h2>3차 배당 활동 우수 <span class="tag">수기 입력</span></h2><p class="desc">10.1~10.25 · 유실적 1/3/5명 이상 → 이관 DB 매출 × 30/50/70% · 센터 판촉비 지급</p><div class="grid g2">'+num('dbn','유실적 인원 (N잡 기준)',S.dbn)+num('dbs','이관 DB 매출 (만원)',S.dbs,10)+'</div><div class="res"><span id="o_dbr"></span><b id="o_db"></b></div></div>';
  h+='<div class="card"><h2>교차 지점장 시책 <span class="tag">수기 입력</span></h2><p class="desc">교차 경영목표 부여 지점장만 해당. 성과 인센티브 Ⅰ·Ⅱ + 전략상품(10.1~10.11, 익월 50% + 2차년도 50%)</p><div class="grid g2">'+num('cx','10월 교차 매출 (만원)',S.cx,10)+num('st','1주차 전략상품 실적 (만원)',S.st,10)+'</div><label class="chk" style="margin-top:8px"><input type="checkbox" data-cx="1"'+(S.cxcut?' checked':'')+'>교차 컷오프 해당 (합산 KMV 2,200% 미만 또는 실손제외 KMV 2,500% 미만) → 부지급으로 계산</label><div id="o_cxh"></div><div class="res"><span>교차 합계</span><b id="o_cx"></b></div></div>';
  h+='<div class="card"><h2>지급 내역</h2><table class="brk" id="o_brk"></table><p class="desc" style="margin:10px 0 0">예상 금액이며 실제 지급은 본부 확정 기준을 따릅니다.</p></div>';
  $('app').innerHTML=h;calc();
}

function calc(){
  // 스팟
  var sp={};['pa','cx'].forEach(function(k){var t=0;spotRows(k).forEach(function(r){t+=r.aw;var tr=document.querySelector('tr[data-row="'+k+'|'+r.id+'"]');if(!tr)return;tr.className=r.ed?'edit':'';tr.querySelector('.aw').textContent=r.aw?M(r.aw):'-';var n=next(SPOT,r.v);tr.querySelector('.nx').textContent=n?'+'+M(n[0]-r.v)+' → '+M(n[1]):'최고';});sp[k]=t;$('o_sp'+k).textContent=W(t)});
  // 3종
  var rk=0;S.rk.forEach(function(n,i){rk+=(+n||0)*ROOKIE[i][1]});
  var ac=head(ACTIVE,ACT_PER,+S.ac||0),ch=head(CHANCE,CHA_PER,+S.ch||0),three=rk+ac+ch,hh=[];
  var na=next(ACTIVE,+S.ac||0),nc=next(CHANCE,+S.ch||0);
  if(na)hh.push('Active '+(na[0]-(+S.ac||0))+'명 더 → '+M(na[1]));
  if(nc)hh.push('Chance '+(nc[0]-(+S.ch||0))+'명 더 → '+M(nc[1]));
  $('o_3h').innerHTML='<div class="desc" style="margin:8px 0 0">Rookie '+M(rk)+' · Active '+M(ac)+' · Chance '+M(ch)+'</div>'+(hh.length?'<div class="hint">'+hh.join(' / ')+'</div>':'');
  $('o_3').textContent=W(three);
  // 성과 PA
  var v=mw(S.pa),p1=perf(PA1,PA1R,v),p2=perf(PA2,PA2R,v),n1=v>=600?null:next(PA1,v);
  $('o_pah').innerHTML='<div class="desc" style="margin:8px 0 0">Ⅰ '+M(p1)+' · Ⅱ '+M(p2)+'</div>'+(n1?'<div class="hint">'+M(n1[0]-v)+' 더 하면 → Ⅰ '+M(n1[1])+' · Ⅱ '+M(perf(PA2,PA2R,n1[0]))+'</div>':'<div class="hint">600만 이상: Ⅰ 매출×100% · Ⅱ 매출×120%</div>');
  $('o_pa').textContent=W(p1+p2);
  // 컷오프
  var k=S.cut.filter(Boolean).length,f=Math.pow(.9,k);
  $('o_cut').textContent=k?k+'개 항목 미달 → '+Math.round(f*1000)/10+'% 적용 (−'+W((three+p1+p2)*(1-f))+')':'';
  var now=(three+p1)*f,y2=p2*f,mv=0;
  if(v>0&&now>v*3){mv=now-v*3;now-=mv;y2+=mv}
  // 3차 배당
  var rt=step(DB,+S.dbn||0),db=mw(S.dbs)*rt;
  $('o_dbr').textContent='지급율 '+Math.round(rt*100)+'%';$('o_db').textContent=W(db);
  // 교차
  var c=mw(S.cx),c1=S.cxcut?0:perf(CX1,CX1R,c),c2=S.cxcut?0:perf(CX2,CX2R,c),st=S.cxcut?0:step(STRAT,mw(S.st)),nx=c>=600?null:next(CX1,c);
  $('o_cxh').innerHTML='<div class="desc" style="margin:8px 0 0">성과 Ⅰ '+M(c1)+' · Ⅱ '+M(c2)+' · 전략상품 익월 '+M(st)+' + 2차년도 '+M(st)+'</div>'+(nx&&!S.cxcut?'<div class="hint">교차 매출 '+M(nx[0]-c)+' 더 하면 → Ⅰ '+M(nx[1])+' · Ⅱ '+M(perf(CX2,CX2R,nx[0]))+'</div>':'');
  $('o_cx').textContent=W(c1+c2+st*2);
  // 합계
  var ctr=sp.pa+sp.cx+db,nowT=now+c1+st,y2T=y2+c2+st,tot=nowT+y2T+ctr;
  $('o_tot').textContent=W(tot);$('o_now').textContent='초회·익월 '+M(nowT);$('o_2y').textContent='2차년도 '+M(y2T);$('o_ctr').textContent='센터 판촉비 '+M(ctr);
  var L=[['1주차 스팟 · 파트너스',sp.pa,'판촉비'],['1주차 스팟 · 교차',sp.cx,'판촉비'],['Rookie',rk*f,'초회'],['Active',ac*f,'초회'],['Chance',ch*f,'초회'],['파트너스 성과 인센티브 Ⅰ',p1*f,'초회'],['파트너스 성과 인센티브 Ⅱ',p2*f,'2차년도'],['3차 배당 활동 우수',db,'판촉비'],['교차 성과 인센티브 Ⅰ',c1,'초회'],['교차 성과 인센티브 Ⅱ',c2,'2차년도'],['교차 전략상품 (익월)',st,'익월'],['교차 전략상품 (2차년도)',st,'2차년도']];
  $('o_brk').innerHTML=L.filter(function(x){return x[1]>0}).map(function(x){return'<tr><td>'+x[0]+' <span class="tag">'+x[2]+'</span></td><td>'+W(x[1])+'</td></tr>'}).join('')+(mv?'<tr><td colspan="2" class="warn" style="text-align:left">1,200% Rule: 1차년 시책금이 매출의 300%를 넘어 '+W(mv)+'은 2차년도 지급으로 이월</td></tr>':'')+'<tr class="t"><td>합계'+(k?' (컷오프 '+Math.round(f*1000)/10+'% 반영)':'')+'</td><td>'+W(tot)+'</td></tr>';
}

$('app').addEventListener('input',function(e){
  var t=e.target,d=t.dataset;
  if(d.k){var m=d.k.match(/^rk(\d)$/);if(m)S.rk[+m[1]]=+t.value||0;else S[d.k]=+t.value||0}
  else if(d.c!=null)S.cut[+d.c]=t.checked?1:0;
  else if(d.cx)S.cxcut=t.checked?1:0;
  else if(d.sv){var p=d.sv.split('|');if(p[1].charAt(0)=='+')S.add[p[0]][+p[1].slice(1)].v=t.value;else if(t.value==='')delete S.ov[p[0]][p[1]];else S.ov[p[0]][p[1]]=t.value}
  else if(d.sn){var q=d.sn.split('|');S.add[q[0]][+q[1]].n=t.value}
  else return;
  save();calc();
});
$('app').addEventListener('click',function(e){var k=e.target.dataset.add;if(!k)return;S.add[k].push({n:'',v:''});save();render()});
$('rst').onclick=function(){if(!confirm(br+' 입력값을 모두 지울까요?'))return;S=blank();save();render()};

/* ---------- raw 업로드 ---------- */
function decode(buf){var u=new Uint8Array(buf);if(u[0]==0xFF&&u[1]==0xFE)return new TextDecoder('utf-16le').decode(buf);if(u[0]==0xFE&&u[1]==0xFF)return new TextDecoder('utf-16be').decode(buf);var t=new TextDecoder('utf-8').decode(buf);if(t.indexOf('�')>=0){try{t=new TextDecoder('euc-kr').decode(buf)}catch(e){}}return t.replace(/^﻿/,'')}
function cells(line,sep){if(sep=='\t')return line.split('\t');var o=[],c='',q=0;for(var i=0;i<line.length;i++){var ch=line[i];if(ch=='"')q=!q;else if(ch==','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}
function n(s){return +String(s||'').replace(/[^0-9.\-]/g,'')||0}
function parse(text){
  var ls=text.split(/\r?\n/).filter(function(l){return l.trim()}),sep=ls[0].indexOf('\t')>=0?'\t':',',H=cells(ls[0],sep).map(function(s){return s.trim()});
  function ix(w){for(var i=0;i<H.length;i++)if(H[i].indexOf(w)>=0)return i;return-1}
  var kind=H.join('').indexOf('파트너스시책')>=0?'pa':H.join('').indexOf('교차시책')>=0?'cx':null;
  var iR=ix('선착순'),iC=ix('지점조직명'),iB=ix('지점직속팀명'),iI=ix('영업가족조직코드'),iN=ix('영업가족명'),iS=ix('시책인정매출'),iA=ix('시책금');
  if(!kind||iB<0||iS<0||iA<0)return null;
  var out={tot:{s:0,a:0},rows:[]};
  ls.slice(1).forEach(function(l){var c=cells(l,sep);if(/총합계|총계/.test(c[iR]+c[iC])){out.tot={s:n(c[iS]),a:n(c[iA])};return}
    out.rows.push({r:n(c[iR])||0,c:(c[iC]||'').trim(),b:(c[iB]||'').trim(),id:(c[iI]||'').trim(),n:(c[iN]||'').trim(),s:n(c[iS]),a:n(c[iA])})});
  if(!out.tot.a)out.rows.forEach(function(r){out.tot.s+=r.s;out.tot.a+=r.a});
  return{kind:kind,data:out};
}
$('fi').onchange=function(){
  var fs=[].slice.call(this.files),msg=[],nd=JSON.parse(JSON.stringify(DATA)),left=fs.length;
  fs.forEach(function(f){var rd=new FileReader();rd.onload=function(){
    var r=null;try{r=parse(decode(rd.result))}catch(e){}
    if(r){nd[r.kind]=r.data;msg.push('✓ '+f.name+' → '+(r.kind=='pa'?'파트너스':'교차')+' 선착순 '+r.data.rows.length+'명')}else msg.push('✗ '+f.name+' → 인식하지 못한 형식 (건너뜀)');
    if(--left==0){var d=new Date();nd.ts=d.getTime();nd.asof=d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);DATA=nd;lset('data',DATA);$('st').textContent=msg.join('\n');initPick()}
  };rd.readAsArrayBuffer(f)});
};
$('exp').onclick=function(){
  var doc=document.documentElement.cloneNode(true);
  doc.querySelector('#raw').textContent=JSON.stringify(DATA).replace(/</g,'\\u003c');
  doc.querySelector('#app').innerHTML='';doc.querySelector('#st').textContent='';doc.querySelector('#cen').innerHTML='';doc.querySelector('#br').innerHTML='';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html>\n'+doc.outerHTML],{type:'text/html'}));
  var d=new Date();a.download='지점장시책_시뮬레이터_'+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.html';a.click();
};
initPick();
